<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка анимаций пород</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#20352d;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:24px}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px}a{color:#166d50}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select{font:inherit;padding:10px;border:1px solid #9bada5;border-radius:6px;background:white}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.breed{border:1px solid #c5d6cc;border-radius:8px;overflow:hidden;background:white}.breed h2{font-size:18px;margin:14px 16px}.yard{height:180px;position:relative;background:#dbeed6;border-bottom:2px solid #829f78;overflow:hidden}.actor{position:absolute;bottom:0;width:144px;height:144px;transform-origin:center bottom}.sprite{width:100%;height:100%;background-repeat:no-repeat}.info{padding:12px 16px;font-size:14px;min-height:44px}.error{color:#a32323}label{display:flex;gap:8px;align-items:center}input{max-width:120px}
</style>
<main>
<header><h1>Анимации всех пород</h1><a href="index.html">Открыть игру</a></header>
<header class="controls">
<select id="state" aria-label="Анимация"><option value="walk">Ходьба</option><option value="idle">Стоит</option><option value="sitdown">Садится</option><option value="sit">Сидит</option><option value="standup">Встаёт</option><option value="reaction">Реакция на почесушки</option></select>
<button id="play">Пауза</button><button id="step" title="Следующий кадр">Кадр →</button><button id="flip">Развернуть</button>
<label>Скорость <input id="speed" type="range" min="0.25" max="1.5" step="0.25" value="1"><output id="rate">1×</output></label>
</header><section class="grid" id="grid"></section>
</main>
<script src="js/content.js"></script>
<script>
const cards = Object.values(BREEDS).map(breed => {
  const card = document.createElement('article'); card.className = 'breed';
  card.innerHTML = '<h2></h2><div class="yard"><div class="actor"><div class="sprite"></div></div></div><div class="info" role="status"></div>';
  card.querySelector('h2').textContent = breed.name; document.querySelector('#grid').append(card);
  return {breed, card, actor:card.querySelector('.actor'), sprite:card.querySelector('.sprite'), info:card.querySelector('.info'), ready:false, extra:0};
});
let state='walk', playing=!matchMedia('(prefers-reduced-motion: reduce)').matches, elapsed=0, previous=0, direction=1, generation=0;
const play=document.querySelector('#play');
function updatePlay(){play.textContent=playing?'Пауза':'Воспроизвести'} updatePlay();
function load(){
  const current=++generation; elapsed=0;
  cards.forEach(c=>{c.ready=false;c.extra=0;c.info.textContent='Загрузка…';c.info.classList.remove('error');const img=new Image();
    img.onload=()=>{if(current!==generation)return;c.ready=true;c.sprite.style.backgroundImage='url("'+img.src+'")';draw()};
    img.onerror=()=>{if(current!==generation)return;c.info.textContent='Не удалось загрузить спрайт';c.info.classList.add('error')};
    img.src=c.breed[state+'Src'];
  });
}
function draw(){cards.forEach(c=>{
  if(!c.ready)return;const b=c.breed,n=b[state+'Frames'];
  const fps=state==='walk'?n/b.walkDuration:(state==='sitdown'||state==='standup'?b.transitionFps:b[state+'Fps']||b.loopFps||6);
  const step=Math.floor(elapsed*fps)+c.extra,rest=b.restPingPong&&(state==='idle'||state==='sit');
  let frame=step%n;if(rest){const p=step%(2*n-2);frame=p<n?p:2*n-2-p}
  if(state==='sitdown'||state==='standup')frame=Math.min(n-1,step%(n+8));
  c.sprite.style.backgroundSize=(n*144)+'px 100%';c.sprite.style.backgroundPosition=(-frame*144)+'px 0';
  const width=c.card.querySelector('.yard').clientWidth,range=Math.max(0,width-144);
  const distance=state==='walk'?elapsed*144*b.walkStride/b.walkDuration:range/2;
  const leg=range?Math.floor(distance/range):0,x=range?(leg%2?range-distance%range:distance%range):0;
  c.actor.style.transform='translateX('+x+'px) scaleX('+(direction*(state==='walk'&&leg%2?-1:1))+')';
  c.info.textContent='Кадр '+(frame+1)+' / '+n+' · '+fps.toFixed(1)+' кадр/с';
})}
document.querySelector('#state').onchange=e=>{state=e.target.value;load()};
play.onclick=()=>{playing=!playing;updatePlay()};
document.querySelector('#step').onclick=()=>{playing=false;updatePlay();cards.forEach(c=>c.extra++);draw()};
document.querySelector('#flip').onclick=()=>{direction*=-1;draw()};
document.querySelector('#speed').oninput=e=>{document.querySelector('#rate').textContent=e.target.value+'×'};
function tick(now){if(previous&&playing&&!document.hidden)elapsed+=Math.min(.05,(now-previous)/1000)*Number(document.querySelector('#speed').value);previous=now;draw();requestAnimationFrame(tick)}
load();requestAnimationFrame(tick);
</script>
</html>
